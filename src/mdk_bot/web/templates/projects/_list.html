<div id="projects-list" class="bg-white border border-slate-200 rounded-lg overflow-hidden">
    {% if projects %}
    <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500">
            <tr>
                <th class="text-left px-3 py-2">Name</th>
                <th class="text-left px-3 py-2">Status</th>
                <th class="text-left px-3 py-2">€/h</th>
            </tr>
        </thead>
        <tbody>
        {% for p in projects %}
            <tr class="border-t border-slate-100">
                <td class="px-3 py-2">{{ p.name }}</td>
                <td class="px-3 py-2">
                    <span class="inline-block text-xs rounded px-2 py-0.5 bg-blue-50 text-blue-700">
                        {{ p.status.value }}
                    </span>
                </td>
                <td class="px-3 py-2 text-slate-600">{{ p.hourly_rate or "" }}</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="p-4 text-sm text-slate-500">No projects yet.</p>
    {% endif %}
</div>
