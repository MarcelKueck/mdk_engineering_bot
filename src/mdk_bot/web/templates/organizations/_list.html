<div id="orgs-list" class="bg-white border border-slate-200 rounded-lg overflow-hidden">
    {% if organizations %}
    <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500">
            <tr>
                <th class="text-left px-3 py-2">Name</th>
                <th class="text-left px-3 py-2">Legal form</th>
                <th class="text-left px-3 py-2">VAT</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
        {% for o in organizations %}
            <tr class="border-t border-slate-100">
                <td class="px-3 py-2">{{ o.name }}</td>
                <td class="px-3 py-2 text-slate-600">{{ o.legal_form or "" }}</td>
                <td class="px-3 py-2 text-slate-600">{{ o.vat_id or "" }}</td>
                <td class="px-3 py-2 text-right">
                    <button hx-delete="/web/organizations/{{ o.id }}"
                            hx-target="#orgs-list" hx-swap="outerHTML"
                            hx-confirm="Delete {{ o.name }}?"
                            class="text-red-500 hover:text-red-700 text-xs">Delete</button>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="p-4 text-sm text-slate-500">No organizations yet.</p>
    {% endif %}
</div>
