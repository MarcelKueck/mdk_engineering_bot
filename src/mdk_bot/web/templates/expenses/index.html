{% extends "base.html" %}
{% block title %}Expenses · MDK Bot{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-semibold">Recurring expenses</h1>
    <span class="text-sm text-slate-500">Monthly burn: <strong>{{ "%.2f" % monthly_burn }} EUR</strong></span>
</div>

<section class="bg-white border border-slate-200 rounded-lg p-4 mb-6">
    <h2 class="font-semibold mb-2 text-sm">New expense</h2>
    <form hx-post="/web/expenses" hx-target="#expenses-list" hx-swap="outerHTML"
          class="grid grid-cols-1 md:grid-cols-4 gap-2">
        <input name="name" placeholder="Name" required
               class="border border-slate-300 rounded px-2 py-1 text-sm" />
        <input name="amount" placeholder="Amount" required
               class="border border-slate-300 rounded px-2 py-1 text-sm" />
        <select name="cadence" class="border border-slate-300 rounded px-2 py-1 text-sm">
            {% for c in cadences %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>
        <button class="bg-blue-600 text-white text-sm rounded px-3 py-1 hover:bg-blue-700">Add</button>
    </form>
</section>

{% include "expenses/_list.html" %}
{% endblock %}
