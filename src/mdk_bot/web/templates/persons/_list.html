<div id="persons-list" class="bg-white border border-slate-200 rounded-lg overflow-hidden">
    {% if persons %}
    <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500">
            <tr>
                <th class="text-left px-3 py-2">Name</th>
                <th class="text-left px-3 py-2">Email</th>
                <th class="text-left px-3 py-2">Phone</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
        {% for p in persons %}
            <tr class="border-t border-slate-100">
                <td class="px-3 py-2">{{ p.name }}</td>
                <td class="px-3 py-2 text-slate-600">{{ p.email or "" }}</td>
                <td class="px-3 py-2 text-slate-600">{{ p.phone or "" }}</td>
                <td class="px-3 py-2 text-right">
                    <button hx-delete="/web/persons/{{ p.id }}"
                            hx-target="#persons-list" hx-swap="outerHTML"
                            hx-confirm="Delete {{ p.name }}?"
                            class="text-red-500 hover:text-red-700 text-xs">Delete</button>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="p-4 text-sm text-slate-500">No persons yet.</p>
    {% endif %}
</div>
