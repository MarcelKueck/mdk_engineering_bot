[project]
name = "mdk-bot"
version = "0.1.0"
description = "MDK Engineering Bot — personal operations platform for a German software freelancer."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marcel Kück" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-telegram-bot>=21.6",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
    "holidays>=0.60",
    "httpx>=0.28",
    "structlog>=24.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    "redis>=5.2",
    "tenacity>=9.0",
    "rich>=13.9",
    "psycopg[binary]>=3.2",
]

[project.scripts]
mdk-bot = "mdk_bot.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "freezegun>=1.5",
    "types-python-dateutil>=2.9",
    "anyio>=4.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdk_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B017"]
"migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mdk_bot"]
plugins = []
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "holidays.*", "telegram.*", "factory.*", "factory_boy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:apscheduler.*",
    "ignore::DeprecationWarning:dateutil.*",
]

[tool.coverage.run]
source = ["src/mdk_bot"]
branch = true
omit = ["src/mdk_bot/main.py", "src/mdk_bot/shared/llm.py", "src/mdk_bot/shared/storage.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
